<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提交成功</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft Yahei", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      color: #0f172a;
    }
    .container { max-width: 960px; margin: 10vh auto; padding: 24px; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 56px 40px;
      text-align: center;
      box-shadow:
        0 30px 80px rgba(2, 6, 23, 0.08),
        0 6px 16px rgba(2, 6, 23, 0.06);
    }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 16px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: #dcfce7; color: #16a34a;
      box-shadow: inset 0 0 0 6px #bbf7d0;
      font-size: 36px; font-weight: 900;
    }
    h1 { margin: 8px 0 8px; font-size: 34px; font-weight: 800; letter-spacing: .2px; }
    p.lead { margin: 0 0 22px; color: #334155; font-size: 18px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 20px; border-radius: 12px; border: 1px solid transparent;
      font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer;
      transition: .18s ease;
    }
    .btn-primary { background: #16a34a; color: #fff; }
    .btn-primary:hover { background: #15803d; }
    .btn-ghost { background: #fff; color: #0f172a; border-color: #e2e8f0; }
    .btn-ghost:hover { border-color: #cbd5e1; background: #f8fafc; }
    .note { margin-top: 18px; color: #64748b; font-size: 14px; }
    @media (max-width: 480px) {
      .card { padding: 40px 20px; border-radius: 16px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">✓</div>
      <h1>提交成功</h1>
      <p class="lead">感谢参与！你的回答已记录。你可以返回首页继续邀请他人填写。</p>
      <div class="actions">
        <a class="btn btn-primary" href="./">返回问卷首页</a>
        <a class="btn btn-ghost" href="javascript:window.close()">关闭页面</a>
      </div>
      <div class="note">结果仅用于项目评估，我们将严格保护你的隐私。</div>
    </div>
  </div>
</body>
</html>
